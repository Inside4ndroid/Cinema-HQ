name: Bug report
description: Report a bug in Cinema HQ
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the details below so we can reproduce and investigate it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly.
      placeholder: Tell us what happened.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
      placeholder: Describe the expected result.
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Which version of Cinema HQ are you using?
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: Which Android version is your device running?
      placeholder: e.g. Android 14
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Device
      description: What device are you using?
      placeholder: e.g. Samsung Galaxy S23
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: Add any screenshots or recordings that help explain the issue.
      placeholder: Drag and drop images here or paste links.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that may help us investigate.
      placeholder: Extra details, logs, region, provider, etc.
    validations:
      required: false
